# @package _global_

# ResNet-based 1D convolutional CTC model operating on raw sEMG signals.
# Pair with transforms=raw_augmented (no spectrogram):
#   python -m emg2qwerty.train model=resnet_ctc transforms=raw_augmented

module:
  _target_: emg2qwerty.lightning.ResNetCTCModule
  channels: [64, 128, 256]
  layers_per_stage: [2, 2, 2]
  kernel_size: 7
  dropout: 0.1

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000  # 4 sec windows for 2kHz EMG
  padding: [1800, 200]  # 900ms past context, 100ms future context
