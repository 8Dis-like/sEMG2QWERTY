# @package _global_

# Transformer-based CTC model for spectrogram features.
# Usage: python emg2qwerty/train.py experiment=transformer_ctc

module:
  _target_: emg2qwerty.lightning.TransformerCTCModule
  in_features: 528
  mlp_features: [384]
  nhead: 8
  num_layers: 4
  dim_feedforward: 1024
  dropout: 0.1

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000
  padding: [1800, 200]

trainer:
  max_epochs: 200
  gradient_clip_val: 1.0

optimizer:
  lr: 5e-5

lr_scheduler: cosine_annealing